name: CI

on:
  push:
    branches: [ main, develop, development ]
  pull_request:
    branches: [ main, development ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Format check - Never fails the CI, just reports
  format:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install formatters
        run: |
          pip install black==24.10.0 isort==5.13.2

      - name: Check formatting
        run: |
          echo "::group::Checking Black formatting"
          black --check --diff backend/ || echo "⚠️ Would reformat files with Black"
          echo "::endgroup::"

          echo "::group::Checking import sorting"
          isort --check-only --diff backend/ || echo "⚠️ Would reorder imports with isort"
          echo "::endgroup::"

          echo "ℹ️ Run 'black backend/' and 'isort backend/' locally to fix formatting"

  # Basic linting - Reports issues but doesn't fail
  lint:
    name: Basic Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linter
        run: |
          pip install flake8==7.1.1 flake8-pyproject

      - name: Run flake8
        continue-on-error: true
        run: |
          echo "::group::Flake8 Results"
          flake8 backend/ --count --statistics || true
          echo "::endgroup::"
          echo "ℹ️ Linting issues are informational only"

  # Tests - This is the only job that can fail the CI
  test:
    name: Fast Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]  # Start with one version, expand later
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          # Add API keys if your tests need them
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Run only unit tests first (they should be fast and reliable); fall back to all tests if no unit marker or selection fails
          pytest tests/ -m unit -v --tb=short || pytest tests/ -v --tb=short

      - name: Run fast tenant tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          make test-tenant-fast

  # RLS tests against ephemeral Postgres; runs migrations first
  test-rls:
    name: RLS Tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: app_db
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: secure_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app_user -d app_db" \
          --health-interval=10s \
          --health-timeout=5s \
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql://app_user:secure_password@localhost:5432/app_db
        run: |
          alembic -c backend/db/alembic.ini upgrade head

      - name: Seed default data (tenant + admin)
        env:
          DATABASE_URL: postgresql://app_user:secure_password@localhost:5432/app_db
          ADMIN_DEFAULT_USERNAME: admin
          ADMIN_DEFAULT_PASSWORD: admin123456789
          ADMIN_DEFAULT_EMAIL: admin@localhost
        run: |
          python backend/scripts/seed_db.py

      - name: Run RLS tests
        env:
          TEST_DATABASE_URL: postgresql://app_user:secure_password@localhost:5432/app_db
        run: |
          make test-rls-pg

  # Summary job - Always runs, provides clear status
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [format, lint, test, test-rls]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## CI Summary"
          echo ""
          echo "### Job Results:"
          echo "- Format Check: ${{ needs.format.result }} (informational)"
          echo "- Lint Check: ${{ needs.lint.result }} (informational)"
          echo "- Tests: ${{ needs.test.result }} ⚠️ **Required to pass**"
          echo ""
          if [[ "${{ needs.test.result }}" == "failure" ]]; then
            echo "❌ CI Failed - Tests must pass"
            exit 1
          else
            echo "✅ CI Passed"
          fi
