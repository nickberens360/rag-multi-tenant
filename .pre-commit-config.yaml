# Minimal pre-commit setup - Only auto-formatting, no failing on style issues
repos:
  # Basic safety checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  # Auto-formatting only - Never fails, just fixes
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.10
        args: [--line-length=120]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=120]

  # Custom checks
  - repo: local
    hooks:
      - id: forbid-legacy-config-imports
        name: Forbid legacy backend.core.config imports
        entry: python scripts/check_no_legacy_config_imports.py
        language: python
        types: [python, markdown]

# Linting and type checking removed from pre-commit
# Run manually when ready:
#   flake8 backend/
#   pytest tests/
