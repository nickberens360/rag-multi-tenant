[flake8]
extend-ignore = E203, W503, E501, E301, E302, E303, E305
per-file-ignores =
    tests/*:E402
    tests/**/*:E402
    advanced_benchmark.py: E402, F541
    benchmark_contextual_retrieval.py: E402, F541
    run_retrieval_benchmark.py: E402, F541
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    .tox,
    .eggs,
    *.egg,
    build,
    dist
